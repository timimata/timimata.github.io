<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seletores CSS - Tiago Machado</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Tipos de seletores CSS</h1>
      <a href="index.html">Voltar às demos</a>
    </header>
    <main class="exemplo">
      <h2 class="selector-element">Tiago Machado</h2>
      <p>Este texto usa um seletor de elemento.</p>
      <p class="caixa">Esta caixa usa um seletor de classe.</p>
      <p id="selector-id">Este texto usa um seletor de id.</p>
      <label>Seletor de atributo: <input type="text" value="DIW" /></label>
      <ul class="selector-list">
        <li>Seletor de pseudo-classe</li>
        <li>Seletor de pseudo-elemento</li>
      </ul>
    </main>
  </body>
</html>
