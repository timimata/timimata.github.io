<!doctype html>
<html lang="pt-PT">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sintra - Página artilhada</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

      <h1>A minha cidade: Sintra</h1>
    </header>

    <main id="zona">
      <p id="mensagem">Passa o rato por cima da imagem.</p>

      <img id="imagem" src="images/capa.jpg" alt="Palácio da Pena em Sintra" />

      <p>Contador: <span id="contador">0</span></p>

      <button type="button" id="botao-zerar">Zerar</button>

      <p id="posicao">Posição do rato: 0, 0</p>
    </main>

    <footer>
      <p>DIW · 2026/27</p>
    </footer>

    <script src="scripts/main.js"></script>
