<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img src="deisi-inverse.svg" alt="DEISI" />
      <h1>Loja</h1>
      <nav>
        <a href="#produtos">Produtos</a>
        <a href="#cesto">Cesto</a>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Produtos</h2>
        <select id="categoria" aria-label="Filtrar por categoria">
          <option value="">Todas as categorias</option>
        </select>
        <select id="ordenar" aria-label="Ordenar pelo preço">
          <option value="">Ordenar pelo preço</option>
          <option value="crescente">Preço crescente</option>
          <option value="decrescente">Preço decrescente</option>
        </select>
        <input
          id="pesquisa"
          type="search"
          placeholder="Pesquisar produto"
          aria-label="Pesquisar produto"
        />
        <div></div>
      </section>

      <section id="cesto">
        <h2>Cesto</h2>
        <div></div>
        <h3>Custo total: <span>0.00</span> €</h3>
        <label>
          <input id="estudante" type="checkbox" />
          És estudante do DEISI?
        </label>
        <input
          id="cupao"
          type="text"
          placeholder="Cupão de desconto"
          aria-label="Cupão de desconto"
        />
        <button id="comprar" type="button">Comprar</button>
        <p id="resultado"></p>
      </section>
    </main>

    <footer>2026, ULusófona</footer>

    <script src="script.js"></script>
  </body>
</html>
